<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlugVPN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000; 
            font-family: 'Inter', sans-serif; 
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #main-site {
            text-align: center;
            opacity: 0; /* Изначально скрыто */
            transition: opacity 2s ease; /* Плавность */
        }

        h1 { 
            font-size: 5rem; 
            margin-bottom: 20px; 
            letter-spacing: -2px;
        }
        
        h1 span { color: #FFD700; }

        p { 
            font-size: 1.5rem; 
            color: #888; 
            margin-bottom: 40px; 
        }

        .btn {
            display: inline-block;
            background: #FFD700;
            color: #000;
            padding: 20px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <main id="main-site">
        <h1>Slug<span>VPN</span></h1>
        <p>Ваша безопасность под защитой.</p>
        <a href="https://t.me/SlugVPN_bot" class="btn">Подключиться</a>
    </main>

    <script>
        const site = document.getElementById('main-site');

        // Когда страница загрузилась, плавно проявляем сайт
        window.onload = () => {
            setTimeout(() => {
                site.style.opacity = '1';
            }, 500); // Небольшая задержка перед началом проявления
        };
    </script>
</body>
</html>
